<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | WebGL Loader Tutorial Build</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body bgcolor="black">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" ></canvas>
      <div id="unity-custom-loading-screen">
        <div id="custom-logo"></div>
        <div id="custom-loader">
          <div class="fill"></div>
          <div class="label"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingScreen = document.querySelector("#unity-custom-loading-screen");
      var customLoadingBar = document.querySelector("#custom-loader");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        // Avoid draining fillrate performance on mobile devices,
        // and default/override low DPI mode on mobile browsers.
        config.devicePixelRatio = 1;
        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        canvas.style.width = "375px";
        canvas.style.height = "812px";
      }
      loadingScreen.style.display = "block";
      
      function resizeCanvas() {
        var baseWidth = 375;  // 基準寬度
        var baseHeight = 812;  // 基準高度
        //var windowWidth = window.innerWidth;
        //var windowHeight = window.innerHeight;
        var windowWidth = window.innerHeight;
        var windowHeight = window.innerWidth;

        var aspectRatio = baseWidth / baseHeight;  // 16:9 的比例
        var windowAspectRatio = windowWidth / windowHeight;

        //var newWidth, newHeight;
        var newWidth = windowWidth;
        var newHeight = windowHeight;

        // 如果窗口的寬高比大於基準寬高比，適配高度並且左右加黑邊
        /*if (windowAspectRatio > aspectRatio) {
          newWidth = windowHeight * aspectRatio;
          newHeight = windowHeight;
        } */
        // 否則適配寬度並且上下加黑邊
        /*else {
          newWidth = windowWidth;
          newHeight = windowWidth / aspectRatio;
        }*/

        //canvas.style.width = newWidth + 'px';
        //canvas.style.height = newHeight + 'px';

        if (unityInstance != null && unityInstance.Module != null && unityInstance.Module.canvas != null) {
          //unityInstance.Module.canvas.width = newWidth * window.devicePixelRatio;
          //unityInstance.Module.canvas.height = newHeight * window.devicePixelRatio;
          //unityInstance.Module.canvas.width = newWidth;
          //unityInstance.Module.canvas.height = newHeight;
        }
      }

      var unityInstance = null;
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          unitySetLoaderProgressTo(progress);
        }).then((instance) => {
          unityInstance = instance;
          loadingScreen.style.display = "none";
          resizeCanvas();  // 在初始化時調整畫布大小
		  window.addEventListener('resize', resizeCanvas);
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // value - 0 to 1
      function unitySetLoaderProgressTo(value)
      {
        const fill = customLoadingBar.getElementsByClassName("fill")[0];
        const fillText = customLoadingBar.getElementsByClassName("label")[0];

        fill.animate(
          [
            { width: (value * 100) + "%" }
          ],
          {
            duration: 300,
            fill: "forwards"
          }
        );

        //fillText.textContent = (value * 100).toFixed() + "%";
      }
    </script>
  </body>
</html>
